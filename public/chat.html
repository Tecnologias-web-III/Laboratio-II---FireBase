<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat de soporte - Help Desk TI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a id="enlacePanel" class="navbar-brand" href="#">Help Desk TI</a>
      <button type="button" onclick="cerrarSesion()" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
    </div>
  </nav>

  <main class="container my-4">
    <a id="volverPanel" href="#" class="btn btn-link px-0">&larr; Volver al panel</a>
    <section class="card card-custom p-3 p-md-4">
      <h1 class="h4 fw-bold mb-1">Chat de soporte</h1>
      <p id="tituloIncidencia" class="text-muted mb-3">Cargando incidencia...</p>
      <p id="idIncidencia" class="small text-muted mb-3"></p>
      <div id="estadoChat" class="small text-muted mb-2" role="status" aria-live="polite"></div>
      <div id="mensajesChat" class="border rounded bg-light p-3 mb-3" style="height: 50vh; min-height: 260px; overflow-y: auto;" aria-live="polite">
        <p class="text-muted mb-0">Cargando mensajes...</p>
      </div>
      <form id="formMensaje" class="row g-2">
        <div class="col-12 col-md-7">
          <label for="textoMensaje" class="visually-hidden">Escribe un mensaje</label>
          <input id="textoMensaje" class="form-control" type="text" maxlength="1000" autocomplete="off" placeholder="Escribe un mensaje..." disabled>
        </div>
        <div class="col-12 col-md-3">
          <label for="archivoMensaje" class="visually-hidden">Adjuntar imagen</label>
          <input id="archivoMensaje" class="form-control" type="file" accept="image/*" disabled>
        </div>
        <div class="col-12 col-md-2 d-grid">
          <button id="btnEnviarMensaje" class="btn btn-primary" type="submit" disabled>Enviar</button>
        </div>
      </form>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
