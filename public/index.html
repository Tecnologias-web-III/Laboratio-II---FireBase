<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Help Desk TI - Cargando...</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">
  <div class="text-center">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-2 text-muted">Verificando sesión y rol...</p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script>
    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      try {
        const doc = await db.collection("usuarios").doc(user.uid).get();
        if (doc.exists) {
          const rol = doc.data().rol;
          if (rol === "admin") window.location.href = "admin_cola.html";
          else if (rol === "tecnico") window.location.href = "tecnico_panel.html";
          else window.location.href = "usuario_panel.html";
        } else {
          window.location.href = "login.html";
        }
      } catch (error) {
        console.error("Error obteniendo rol:", error);
        window.location.href = "login.html";
      }
    });
  </script>
</body>
</html>
