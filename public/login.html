<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Help Desk TI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center min-vh-100 py-4">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-8 col-md-6 col-lg-4">
        <div class="card card-custom p-4">
          <h4 class="text-center mb-1 fw-bold text-primary">Help Desk TI</h4>
          <p class="text-center text-muted small mb-4">Sistema de Reportes de Averías</p>
          
          <form id="formLogin">
            <div class="mb-3">
              <label class="form-label">Correo electrónico</label>
              <input type="email" id="loginCorreo" class="form-control" required placeholder="usuario@empresa.com">
            </div>
            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <input type="password" id="loginPassword" class="form-control" required placeholder="******">
            </div>
            <div id="loginError" class="alert alert-danger d-none py-2 small"></div>
            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
          </form>

          <hr>
          <div class="text-center">
            <a href="registro.html" class="text-decoration-none small">¿No tienes cuenta? Regístrate aquí</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
