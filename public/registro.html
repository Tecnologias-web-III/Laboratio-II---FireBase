<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Help Desk TI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center min-vh-100 py-4">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5">
        <div class="card card-custom p-3 p-sm-4">
          <h4 class="text-center mb-3 fw-bold text-primary">Crear Cuenta</h4>
          
          <form id="formRegistro">
            <div class="mb-3">
              <label class="form-label">Nombre completo</label>
              <input type="text" id="regNombre" class="form-control" required placeholder="Ej. Yul Reyes">
            </div>
            <div class="mb-3">
              <label class="form-label">Correo electrónico</label>
              <input type="email" id="regCorreo" class="form-control" required placeholder="correo@empresa.com">
            </div>
            <div class="mb-3">
              <label class="form-label">Contraseña (mínimo 6 caracteres)</label>
              <input type="password" id="regPassword" class="form-control" minlength="6" required>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Departamento</label>
                <select id="regDepartamento" class="form-select" required>
                  <option value="TI">TI / Soporte</option>
                  <option value="Contabilidad">Contabilidad</option>
                  <option value="Ventas">Ventas</option>
                  <option value="Recursos Humanos">Recursos Humanos</option>
                  <option value="Operaciones">Operaciones</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Rol en el sistema</label>
                <select id="regRol" class="form-select" required>
                  <option value="usuario">Usuario (Reporta)</option>
                  <option value="tecnico">Técnico (Resuelve)</option>
                  <option value="admin">Administrador</option>
                </select>
              </div>
            </div>

            <div id="regError" class="alert alert-danger d-none py-2 small"></div>
            <button type="submit" class="btn btn-success w-100">Registrar Usuario</button>
          </form>

          <hr>
          <div class="text-center">
            <a href="login.html" class="text-decoration-none small">¿Ya tienes cuenta? Inicia sesión</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
