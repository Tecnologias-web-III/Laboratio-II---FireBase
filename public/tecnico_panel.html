<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Técnico - Help Desk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/2c7bfef965.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="container">
    <header class="header row mb-4">
        <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Help Desk - Técnico</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><button type="button" class="nav-link border-0 bg-transparent" onclick="cerrarSesion()">Cerrar sesión</button></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="row mt-5 pt-4">
        <div class="col-12">
            <h2>Panel de Averías Asignadas</h2>
            <hr>
            <div id="contenedorAsignadas" class="row">
                <p class="text-muted">Cargando averías asignadas...</p>
            </div>
        </div>
    </main>

    <div class="modal fade" id="modalGestion" tabindex="-1" aria-labelledby="modalGestionLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalGestionLabel">Gestionar Incidencia</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="txtIncidenciaId">
                    
                    <div class="mb-3">
                        <h6 id="lblTituloIncidencia" class="fw-bold"></h6>
                        <p id="lblDescripcionIncidencia" class="text-muted"></p>
                    </div>
                    <hr>

                    <h5 class="text-primary">Registrar en Bitácora</h5>
                    <div class="mb-3">
                        <label for="txtComentarioBitacora" class="form-label">Comentario u Observación:</label>
                        <textarea id="txtComentarioBitacora" class="form-control" rows="2" placeholder="Describa el avance técnico..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="txtArchivoBitacora" class="form-label">Evidencia fotográfica (Opcional):</label>
                        <input type="file" id="txtArchivoBitacora" class="form-control" accept="image/*">
                    </div>
                    <button type="button" id="btnGuardarBitacora" class="btn btn-secondary btn-sm mb-3">Agregar a Bitácora</button>

                    <div class="mb-4">
                        <h6>Historial de Bitácora:</h6>
                        <div id="historialBitacora" class="border p-2 rounded bg-light" style="max-height: 150px; overflow-y: auto;">
                            <small class="text-muted">No hay registros aún.</small>
                        </div>
                    </div>
                    <hr>

                    <h5 class="text-success">Finalizar Reparación</h5>
                    <div class="mb-3">
                        <label for="txtArchivoSolucion" class="form-label">Foto de Evidencia del Resultado Final:</label>
                        <input type="file" id="txtArchivoSolucion" class="form-control" accept="image/*" required>
                    </div>
                    <button type="button" id="btnMarcarResuelta" class="btn btn-success">Marcar como Resuelta</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/tecnico_panel.js"></script>
</body>
</html>
