<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Averias - Help Desk TI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="usuario_panel.html">Help Desk TI | Usuario</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navUsuario"
        aria-controls="navUsuario" aria-expanded="false" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navUsuario">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link active" href="#reportar">Reportar avería</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#misIncidencias">Mis averías</a>
          </li>
        </ul>
        <span id="nombreUsuarioNav" class="navbar-text text-light me-3 small"></span>
        <button type="button" onclick="cerrarSesion()" class="btn btn-outline-light btn-sm">Cerrar sesion</button>
      </div>
    </div>
  </nav>

  <main class="container my-3 my-md-4">
    <section id="reportar" class="card card-custom p-3 p-md-4 mb-4">
      <h4 class="fw-bold mb-3">Reportar una avería</h4>
      <form id="formIncidencia" class="row g-3">
        <div class="col-12 col-md-6">
          <label for="titulo" class="form-label">Titulo</label>
          <input type="text" id="titulo" class="form-control" maxlength="120" required>
        </div>
        <div class="col-12 col-md-3">
          <label for="tipo" class="form-label">Tipo</label>
          <select id="tipo" class="form-select" required>
            <option value="">Seleccione...</option>
            <option value="Hardware">Hardware</option>
            <option value="Software">Software</option>
          </select>
        </div>
        <div class="col-12 col-md-3">
          <label for="departamento" class="form-label">Departamento</label>
          <input type="text" id="departamento" class="form-control" readonly required>
        </div>
        <div class="col-12">
          <label for="descripcion" class="form-label">Descripcion</label>
          <textarea id="descripcion" class="form-control" rows="4" maxlength="1000" required></textarea>
        </div>
        <div class="col-12">
          <label for="fotoReporte" class="form-label">Foto del daño</label>
          <input type="file" id="fotoReporte" class="form-control" accept="image/*" required>
          <div class="form-text">Formatos de imagen; se recomienda un archivo menor a 10 MB.</div>
        </div>
        <div id="formIncidenciaError" class="col-12 alert alert-danger d-none py-2 mb-0"></div>
        <div id="formIncidenciaSuccess" class="col-12 alert alert-success d-none py-2 mb-0"></div>
        <div class="col-12 d-grid d-sm-block">
          <button id="btnEnviarIncidencia" type="submit" class="btn btn-primary">
            Enviar reporte
          </button>
        </div>
      </form>
    </section>

    <section id="misIncidencias">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h4 class="fw-bold mb-0">Mis averías</h4>
        <select id="filtroEstadoUsuario" class="form-select form-select-sm filtro-estado" aria-label="Filtrar mis averías por estado">
          <option value="TODOS">Todos los estados</option>
          <option value="Pendiente">Pendiente</option>
          <option value="Asignada">Asignada</option>
          <option value="Resuelta">Resuelta</option>
          <option value="Cerrada">Cerrada</option>
          <option value="Rechazada">Rechazada</option>
          <option value="Cancelada">Cancelada</option>
        </select>
      </div>
      <div id="contenedorMisIncidencias" class="row g-3">
        <div class="col-12 text-center py-5 text-muted">Cargando mis reportes...</div>
      </div>
    </section>
  </main>

  <div class="modal fade" id="modalRechazo" tabindex="-1" aria-labelledby="modalRechazoLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalRechazoLabel">Rechazar solucion</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="incidenciaRechazoId">
          <label for="motivoRechazo" class="form-label">Motivo del rechazo</label>
          <textarea id="motivoRechazo" class="form-control" rows="4" minlength="10" maxlength="500" required></textarea>
          <div id="rechazoError" class="text-danger small mt-2 d-none"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" id="btnConfirmarRechazo" class="btn btn-danger">Confirmar rechazo</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/usuario_panel.js"></script>
</body>
</html>
